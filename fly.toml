# Fly.io configuration for TheVisaBay.com
app = "thevisabay"
primary_region = "sin"  # Singapore region for better performance in Asia

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  grace_period = "5s"
  method = "GET"
  path = "/api/health"
  protocol = "http"
  timeout = "10s"
  tls_skip_verify = false

[http_service.concurrency]
  type = "connections"
  hard_limit = 25
  soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Volumes disabled - app works without persistent storage
# [[mounts]]
# source = "thevisabay_data"
# destination = "/data"

# Simplified configuration for NodeJS deployment
