app = "thevisabay"
primary_region = "sin"  # Singapore region, good for Asia users

[build]
  # Use Dockerfile for building the app (default behavior)
  # If you want to specify a builder, you can do so here, but Dockerfile is preferred.

[env]
  NODE_ENV = "production"
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [services.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 25

  [[services.ports]]
    port = 80

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = 15000
    timeout = 2000
    grace_period = "5s"
    restart_limit = 6