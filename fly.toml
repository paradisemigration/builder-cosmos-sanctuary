app = "thevisabay"
primary_region = "sin"  # Singapore region, change if needed

[build]
  # Uses Dockerfile in root automatically

[env]
  NODE_ENV = "production"
  PORT = "8080"

[experimental]
  allowed_public_ports = [8080]
  auto_rollback = true

[http_service]
  internal_port = 8080
  force_https = true
  min_machines_running = 1
  auto_start_machines = true
  auto_stop_machines = true

  [[http_service.checks]]
    type = "http"
    path = "/api/health"
    interval = "15s"
    timeout = "10s"
    grace_period = "5s"
