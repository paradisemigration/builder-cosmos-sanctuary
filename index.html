      // Browse Page Component

        const [searchTerm, setSearchTerm] = React.useState("");
        const [filterLocation, setFilterLocation] = React.useState("all");

        const filteredBusinesses = mockBusinesses.filter(business => {
          const matchesSearch = business.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                               business.specialties.some(spec => spec.toLowerCase().includes(searchTerm.toLowerCase()));
          const matchesLocation = filterLocation === "all" ||
                                 business.location.toLowerCase().includes(filterLocation.toLowerCase());
          return matchesSearch && matchesLocation;
        });

        return React.createElement(
          "div",
          {

              fontFamily: "system-ui, -apple-system, sans-serif",
